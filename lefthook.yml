# Lefthook - Orquestador de Git Hooks de Alto Rendimiento para Megacore (2026)
# Configuración paralela asíncrona para controles locales rápidos antes de commits.

pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: if [ -f "./node_modules/.bin/biome" ]; then ./node_modules/.bin/biome check --write --no-errors-on-unmatched {staged_files}; else npx --no-install @biomejs/biome check --write --no-errors-on-unmatched {staged_files} 2>/dev/null || npx -y @biomejs/biome check --write --no-errors-on-unmatched {staged_files}; fi
      stage_fixed: true
    security-audit:
      run: ./scripts/security_audit.sh


post-commit:
  commands:
    update-codebase-memory:
      run: |
        /home/asanchez/.local/bin/codebase-memory-mcp cli index_repository '{"repo_path": "/home/asanchez/Code/forgejo/repositorios/everything-claude-code", "mode": "moderate"}' &

post-merge:
  commands:
    update-codebase-memory:
      run: |
        /home/asanchez/.local/bin/codebase-memory-mcp cli index_repository '{"repo_path": "/home/asanchez/Code/forgejo/repositorios/everything-claude-code", "mode": "moderate"}' &
